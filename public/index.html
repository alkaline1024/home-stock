<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#203f37" />
    <meta
      name="description"
      content="จดของในบ้าน ดูของที่ควรใช้ก่อน และเตรียมรายการซื้อในที่เดียว"
    />
    <title>home-stock · ของในบ้าน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main id="entry" class="entry">
      <section class="cover" aria-label="home-stock">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>home-stock
        </div>
        <div class="cover-copy">
          <h1>วันนี้ในบ้าน<br />มีอะไรบ้าง<span class="dot">.</span></h1>
          <p>จดของที่มีอยู่ รู้วันหมดอายุ<br />และเตรียมรายการซื้อครั้งถัดไป</p>
        </div>
        <div class="still-life" aria-hidden="true">
          <i class="tin"></i><i class="jar"></i><i class="box"></i
          ><i class="shelf"></i>
        </div>
      </section>
      <section class="entry-panel">
        <div class="entry-form">
          <h2 id="entry-title">เปิดตู้กับข้าว</h2>
          <form id="login" hidden>
            <label for="password">รหัสผ่านของบ้าน</label>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
            />
            <p id="login-error" class="error" role="alert"></p>
            <button class="primary full" type="submit">
              เข้าสู่ระบบ <span aria-hidden="true">→</span>
            </button>
          </form>
          <div id="checking" role="status">กำลังเปิดรายการ…</div>
          <div id="unavailable" hidden>
            <p id="unavailable-text"></p>
            <button type="button" class="secondary" data-action="retry">
              ลองอีกครั้ง
            </button>
          </div>
          <a class="sample" href="/home-stock.html"
            >ลองดูตัวอย่างการใช้งาน <span aria-hidden="true">↗</span></a
          >
        </div>
      </section>
    </main>
    <div id="app" hidden>
      <header class="app-header">
        <div class="wrap top">
          <a class="brand" href="#today"
            ><span class="mark" aria-hidden="true"></span>home-stock</a
          ><button type="button" class="text-button" data-action="logout">
            ออกจากระบบ
          </button>
        </div>
      </header>
      <main class="wrap workspace">
        <nav aria-label="เมนูหลัก" class="tabs">
          <a href="#today" data-tab="today">วันนี้</a
          ><a href="#stock" data-tab="stock">ของในบ้าน</a
          ><a href="#shopping" data-tab="shopping"
            >รายการซื้อ <span id="shopping-count">0</span></a
          >
        </nav>
        <p id="sync-error" role="alert" class="sync-error" hidden></p>
        <div class="page-title">
          <div>
            <p id="date-label" class="eyebrow"></p>
            <h1 id="screen-title">วันนี้</h1>
          </div>
          <button id="page-add" type="button" class="primary" data-action="add">
            <span class="plus" aria-hidden="true">＋</span> เพิ่มของ
          </button>
        </div>
        <div id="tools" class="filters" hidden>
          <label class="search"
            ><span>ค้นหาของ</span
            ><input
              id="query"
              type="search"
              placeholder="ชื่อของหรือที่เก็บ"
              autocomplete="off"
          /></label>
          <label
            ><span>หมวด</span
            ><select id="category-filter">
              <option value="">ทุกหมวด</option>
              <option>เนื้อสัตว์</option>
              <option>ผัก</option>
              <option>อาหารสด</option>
              <option>อาหารแห้ง</option>
              <option>อื่น ๆ</option>
            </select></label
          >
          <label
            ><span>ที่เก็บ</span
            ><select id="location-filter">
              <option value="">ทุกที่เก็บ</option>
            </select></label
          >
        </div>
        <div id="content"></div>
        <footer>
          <span>home-stock</span
          ><a href="/home-stock.html">ดูตัวอย่างการใช้งาน ↗</a>
        </footer>
      </main>
    </div>
    <dialog id="editor" aria-labelledby="editor-title">
      <div class="dialog-head">
        <h2 id="editor-title"></h2>
        <button
          type="button"
          class="close"
          aria-label="ปิด"
          data-action="close"
        >
          ×
        </button>
      </div>
      <form id="editor-form">
        <div id="fields"></div>
        <p id="form-error" role="alert" class="error"></p>
        <div class="dialog-actions">
          <button type="button" class="secondary" data-action="close">
            ยกเลิก</button
          ><button type="submit" id="save" class="primary">บันทึก</button>
        </div>
      </form>
    </dialog>
    <div
      id="notice"
      class="notice"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <noscript>กรุณาเปิด JavaScript เพื่อใช้งาน home-stock</noscript>
  </body>
</html>
